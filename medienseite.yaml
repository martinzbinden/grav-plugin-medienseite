enabled: true
# Name in E-Mails und in der Einwilligung - leer = Titel der Website (site.title)
seitenname: ''
# Ablage ausserhalb des Webverzeichnisses, relativ zum Grav-Ordner.
# Je Bereich ein Unterordner; Anmelde-Zustand (Codes, Freigabe-Links) in _zugang/.
media_dir: '../medienseite-dateien'
# Route der Medienseite (fuer Links in E-Mails) und der Datenschutzerklaerung
seite: '/medien'
datenschutz_seite: '/datenschutz'
# Wer Dateien hochladen, bearbeiten und loeschen darf
verwalten_permission: 'admin.login'
max_upload_mb: 50
# Farbe der Freigabe- und Hinweisseiten (die Medienseite selbst nutzt --color-primary des Themes)
akzentfarbe: '#2f6b62'
bereiche:
  - schluessel: pressebilder
    titel: 'Pressebilder'
    oeffentlich: false
  - schluessel: dokumente
    titel: 'Berichte und Dokumente'
    oeffentlich: false
  - schluessel: grafiken
    titel: 'Grafiken und Karten'
    oeffentlich: false
  - schluessel: logos
    titel: 'Logos und Vorlagen'
    oeffentlich: false
auth:
  registrierung: true
  # approval = neue Konten erst nach Freigabe aktiv; open = sofort nach Code-Bestaetigung
  modus: approval
  # leer = Empfaenger aus der E-Mail-Konfiguration der Website (plugins.email.to)
  benachrichtigung: ''
