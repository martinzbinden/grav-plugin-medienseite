enabled: true
# Name in E-Mails und in der Einwilligung - leer = Titel der Website (site.title)
seitenname: ''
# Ablage, relativ zum Grav-Ordner - am besten ausserhalb des Webverzeichnisses.
# Je Bereich ein Unterordner. Kann zugleich Grav's Medienordner sein
# (user/media als Verknuepfung darauf), dann erscheinen die Bereiche im Admin
# unter "Medien". Direkter Abruf: oeffentliche Bereiche frei, gesperrte nicht
# (das Plugin schreibt je Ordner eine .htaccess).
media_dir: '../medienseite-dateien'
# Dateien ausserhalb der Bereiche (z.B. im Admin unter "Medien" hochgeladen)
# direkt abrufbar - noetig, um sie in Seiten einzubinden
wurzel_oeffentlich: false
# Anmelde-Zustand (Codes, Freigabe-Links), gesperrt per .htaccess
daten_dir: 'user://data/medienseite'
# Route der Medienseite (fuer Links in E-Mails) und der Datenschutzerklaerung
seite: '/medien'
datenschutz_seite: '/datenschutz'
# Wer Dateien hochladen, bearbeiten und loeschen darf
verwalten_permission: 'admin.login'
max_upload_mb: 50
# Farbe der Freigabe- und Hinweisseiten (die Medienseite selbst nutzt --color-primary des Themes)
akzentfarbe: '#2f6b62'
bereiche:
  - schluessel: pressebilder
    titel: 'Pressebilder'
    oeffentlich: false
  - schluessel: dokumente
    titel: 'Berichte und Dokumente'
    oeffentlich: false
  - schluessel: grafiken
    titel: 'Grafiken und Karten'
    oeffentlich: false
  - schluessel: logos
    titel: 'Logos und Vorlagen'
    oeffentlich: false
auth:
  registrierung: true
  # approval = neue Konten erst nach Freigabe aktiv; open = sofort nach Code-Bestaetigung
  modus: approval
  # leer = Empfaenger aus der E-Mail-Konfiguration der Website (plugins.email.to)
  benachrichtigung: ''
